services:
  eshopdb:
    container_name: eshopdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=EShopDb
    restart: "no"
    ports:
      - "5432:5432"
    volumes:
      - postgres_eshopdb:/var/lib/postgresql

  seq:
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    restart: "no"
    ports:
      - "5341:5341"
      - "9091:80"